# HTTP (lokal va HTTPS sozlanmagan holat). Production uchun infra/nginx/ssl.conf.template + docker-compose.prod.yml.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=iot:10m rate=2r/s;

server {
    listen 80;
    server_name _;

    # Docker ichki DNS: upstream'lar so'rov vaqtida aniqlanadi (bot o'chiq bo'lsa ham nginx ishga tushadi)
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:8000;
    set $bot_upstream http://bot:8081;

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Let's Encrypt HTTP-01 tekshiruvi (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/v1/iot/ {
        limit_req zone=iot burst=20 nodelay;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location = /health {
        proxy_pass $api_upstream/health;
    }

    # Telegram webhook (BOT_MODE=webhook)
    location /tg/webhook {
        proxy_pass $bot_upstream;
        proxy_set_header Host $host;
    }

    # Mini App (SPA)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
