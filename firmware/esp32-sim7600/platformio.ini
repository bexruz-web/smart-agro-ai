; Smart Agro AI — ESP32 DevKit V1 + SIM7600G-H R2 (4G LTE) dala stansiyasi
;
; Oldin:        cp include/config.example.h include/config.h   (va to'ldiring)
; Yig'ish:      pio run                    (haqiqiy LTE rejim)
;               pio run -e esp32dev_sim    (SIMULATION_MODE=1: modem yo'q, JSON -> Serial)
; Yuklash:      pio run -t upload
; Monitor:      pio device monitor
;
; Kutubxona versiyalari qat'iy belgilangan (takrorlanuvchi yig'ish uchun).

[platformio]
default_envs = esp32dev

[env]
platform = platformio/espressif32 @ 6.13.0
framework = arduino
board = esp32dev
board_build.partitions = default.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"0.2.0\"
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_RX_BUFFER=1024
lib_deps =
    vshymanskyy/TinyGSM @ 0.12.0
    digitaldragon/SSLClient @ 1.3.2
    arduino-libraries/ArduinoHttpClient @ 0.6.1
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 4.0.6
    adafruit/Adafruit BME280 Library @ 2.2.4
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit BusIO @ 1.17.4
    claws/BH1750 @ 1.3.0
    bblanchon/ArduinoJson @ 7.4.3

[env:esp32dev]

; Cirkit Designer simulyatsiyasi bilan bir xil kod yo'li (modem kompilyatsiya qilinmaydi):
[env:esp32dev_sim]
build_flags =
    ${env.build_flags}
    -DSIMULATION_MODE=1
