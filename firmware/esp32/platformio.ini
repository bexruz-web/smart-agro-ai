; Smart Agro AI — ESP32 sensor tuguni (PlatformIO, Arduino framework)
;
; Yig'ish:      pio run
; Yuklash:      pio run -t upload
; Monitor:      pio device monitor
;
; Oldin include/config.example.h -> include/config.h nusxa ko'chiring va to'ldiring.

[platformio]
default_envs = esp32dev

[env]
platform = platformio/espressif32 @ 6.13.0
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"0.1.0\"
lib_deps =
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 4.0.6
    adafruit/DHT sensor library @ 1.4.7
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit SHT31 Library @ 2.2.2
    adafruit/Adafruit BusIO @ 1.17.4
    claws/BH1750 @ 1.3.0
    bblanchon/ArduinoJson @ 7.4.3

[env:esp32dev]
board = esp32dev
; Standart 4 MB flash: app ~1.3 MB x2 (OTA) + ~1.5 MB SPIFFS/LittleFS bo'limi
board_build.partitions = default.csv

; Demo rejim (15 s interval, har o'lchov darhol yuboriladi):
;   pio run -e esp32dev_demo -t upload
[env:esp32dev_demo]
board = esp32dev
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    -DDEMO_MODE=1
