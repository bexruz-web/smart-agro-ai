# Smart Agro AI — ekinlar bilim bazasi.
# Qoida: har bir qiymatning manbasi bor. Manbasi aniq bo'lmagan yoki tekshirilmagan qiymatlar
# `status: tekshirilmagan` yoki `null` bilan belgilangan va UI/AI'da "taxmin" deb ko'rsatiladi.
#
# Manbalar:
#   FAO56   — Allen R.G. va b., FAO Irrigation and Drainage Paper 56 (1998): Kc (12-jadval),
#             bosqich uzunliklari (11-jadval, indikativ), Zr va p (22-jadval).
#   FAO33   — Doorenbos & Kassam, FAO Irrigation and Drainage Paper 33 (1979): Ky (butun mavsum).
#   FAO29   — Ayers & Westcot, FAO Irrigation and Drainage Paper 29 Rev.1 (1985): ECe chegarasi (dS/m).
#   FAOCW   — FAO Land & Water "Crop Water Information": mavsumiy suv talabi (mm).
#   GEN     — keng qo'llanadigan agronomik konventsiya; rasmiy manba bilan tasdiqlash kerak.
#   REGION  — O'zbekiston uchun mintaqaviy hosil darajasi; FAOSTAT bilan tasdiqlash kerak.

sources:
  FAO56: "FAO Irrigation and Drainage Paper 56 (Allen va b., 1998)"
  FAO33: "FAO Irrigation and Drainage Paper 33 (Doorenbos & Kassam, 1979)"
  FAO29: "FAO Irrigation and Drainage Paper 29 Rev.1 (Ayers & Westcot, 1985)"
  FAOCW: "FAO Land & Water — Crop Water Information"
  GEN: "Keng qo'llanadigan agronomik qiymat (tekshirilmagan)"
  REGION: "O'zbekiston uchun mintaqaviy taxmin (FAOSTAT bilan tasdiqlash kerak)"

crops:
  wheat_winter:
    name_uz: "Kuzgi bug'doy"
    family: Poaceae
    family_uz: "Boshoqdoshlar"
    default_planting: "10-15"          # oy-kun
    stages_days: {ini: 30, dev: 140, mid: 40, late: 30}   # FAO56 11-jadval (indikativ, qishlash bilan)
    kc: {ini: 0.7, mid: 1.15, end: 0.4}                     # FAO56 12-jadval
    root_depth_m: 1.5                                        # FAO56 22-jadval (1.5–1.8)
    depletion_p: 0.55                                        # FAO56 22-jadval
    ky: 1.0                                                  # FAO33 (kuzgi bug'doy)
    ece_threshold_ds_m: 6.0                                  # FAO29
    ece_slope_pct_per_ds_m: 7.1                              # FAO29 (Maas-Hoffman)
    water_need_mm: [450, 650]                                # FAOCW
    t_base_c: 0.0                                            # GEN
    frost_kill_c: -15.0                                      # GEN (qishlash davrida chidamli)
    frost_sensitive_stages: [mid]                            # GEN (boshoqlash/gullash)
    heat_stress_c: 32.0                                      # GEN (gullash davrida)
    ph_range: [6.0, 7.5]                                     # GEN — tekshirilmagan
    potential_yield_t_ha: [4.0, 5.5, 7.0]                    # REGION (min, odatiy, max)
    product_uz: "don"
    sources: {stages_days: FAO56, kc: FAO56, root_depth_m: FAO56, depletion_p: FAO56, ky: FAO33,
              ece_threshold_ds_m: FAO29, water_need_mm: FAOCW, t_base_c: GEN, heat_stress_c: GEN,
              ph_range: GEN, potential_yield_t_ha: REGION}

  cotton:
