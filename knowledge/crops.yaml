# Almashlab ekish qoidalari (ROT-4). Ballar shaffof va UI'da ko'rsatiladi.
rotation_rules:
  same_crop_penalty: -25          # ketma-ket bir xil ekin
  same_crop_max_consecutive: 2    # 2 yildan ko'p ketma-ket — chiqarib tashlanadi
  same_family_penalty: -12        # ketma-ket bir oila (kasallik/zararkunanda sikli)
  legume_after_cereal_bonus: 15   # dukkakli azot to'playdi
  after_legume_bonus: 10          # dukkakli/bedadan keyingi ekin azotdan foydalanadi
  cotton_after_alfalfa_bonus: 8   # O'zbekistonda an'anaviy g'o'za–beda almashlab ekishi (GEN)
  salinity_exclusion_factor: 1.5  # ECe > chegara×1.5 — chiqarib tashlanadi
  ph_outside_penalty: -10
